name: Build Android APK (Release)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apk.yml'
    tags:
      - 'v*'

permissions:
  actions: write
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Gerar APK de Produção
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências
        run: |
          cd mobile
          flutter pub get

      - name: Aceitar Licenças e Configurar NDK Android
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk/27.0.12077973" ]; then
            echo "Instalando NDK estável 27.0.12077973..."
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
          else
            echo "NDK 27.0.12077973 pre-instalado no runner com sucesso."
          fi

      - name: Compilar APK Release
        run: |
          cd mobile
          flutter build apk --release --dart-define=API_BASE_URL="${{ vars.API_BASE_URL || 'https://b2b-personal-ia-backend.onrender.com/api/v1' }}"

      - name: Rotacionar Artefatos Antigos (Teto Maximo de 3 APKs)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'b2b-personal-ia-release-apk',
              per_page: 100,
            });
            const active = (res.data.artifacts || [])
              .filter(a => !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const old of active.slice(2)) {
              console.log(`Removendo APK antigo ID=${old.id} (${old.created_at}) para preservar cota de 500MB`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: old.id,
              });
            }

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: b2b-personal-ia-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
