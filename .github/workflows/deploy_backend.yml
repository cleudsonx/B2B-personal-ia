name: Deploy Backend (Docker & Cloud)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_backend.yml'
      - 'render.yaml'
      - 'railway.toml'
  workflow_dispatch:

jobs:
  docker-build:
    name: Build & Validação Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: b2b-personal-ia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notificar Deploy Hook Render (Opcional)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Disparando Deploy Hook no Render..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deploy hook enviado com sucesso!"
          else
            echo "RENDER_DEPLOY_HOOK_URL não configurado nos Secrets. Deploy gerenciado nativamente pelo Render via GitHub App/AutoDeploy."
          fi
