name: Deploy Flutter Web para GitHub Pages

# Desativado: o deploy web usa Firebase Hosting. Execução apenas manual.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências
        run: |
          cd mobile
          flutter pub get

      - name: Build Flutter Web Release
        run: |
          cd mobile
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="https://b2b-personal-ia-backend.onrender.com/api/v1"
          echo "shaipados.com" > build/web/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
