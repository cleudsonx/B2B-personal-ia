name: Deploy Flutter Web para Firebase Hosting

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'firebase.json'
      - '.github/workflows/deploy_firebase.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências
        run: |
          cd mobile
          flutter pub get

      - name: Auto-Versionamento PWA & Build Stamp
        run: |
          cd mobile
          dart run tool/update_version.dart

      - name: Build Flutter Web Release
        run: |
          cd mobile
          flutter build web --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase_sa.json"
            firebase deploy --only hosting --project shaipados-labs --non-interactive
            rm -f "$RUNNER_TEMP/firebase_sa.json"
          else
            echo "FIREBASE_SERVICE_ACCOUNT secret not provided; skipping."
          fi
