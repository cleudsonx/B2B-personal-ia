# Blueprint de Infraestrutura como Código (IaC) para Render.com
# Conecta ao repositório GitHub cleudsonx/B2B-personal-ia
services:
  - type: web
    name: b2b-personal-ia-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEFAULT_FAST_MODEL
        value: gemini-2.5-flash
      - key: DEFAULT_DEEP_MODEL
        value: gemini-2.5-flash
      - key: AIS_GATEWAY_URL
        value: https://ais-dev-3ey6ymjmlzt5sh4qusmboi-873261240850.us-east1.run.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://rgbyfiulomxpqkuufdtg.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_GM85tixsI7l1WTU3jhEmoQ_s_pv_F6C
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: https://rgbyfiulomxpqkuufdtg.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_API_URL
        value: https://api.asaas.com/v3
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://shaipados.com", "https://mrcoach.shaipados.com", "https://app.shaipados.com"]'

  - type: static_site
    name: shaipados-frontend
    rootDir: mobile
    buildCommand: git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter && export PATH="$PATH:./_flutter/bin" && flutter pub get && flutter build web --release
    staticPublishPath: build/web
    autoDeploy: true
