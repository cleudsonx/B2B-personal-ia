  <script>
    const APP_CURRENT_BUILD = 2026103117;

    // =========================================================================
    // Blindagem Anti-Cache de Manifests e Fontes (Bypass Disk Cache & SW Stale)
    // Garante que AssetManifest e FontManifest nunca sejam lidos de cache antigo
    // =========================================================================
    (function initAssetCacheGuard() {
      try {
        const originalFetch = window.fetch;
        if (typeof originalFetch === 'function') {
          window.fetch = function(input, init) {
            try {
              const url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
              if (url) {
                // Força cache-busting por build nos manifests críticos do Flutter Web
                if (
                  url.includes('AssetManifest') ||
                  url.includes('FontManifest') ||
                  url.includes('version.json')
                ) {
                  const sep = url.includes('?') ? '&' : '?';
                  const bustedUrl = url.includes('_b=') ? url : (url + sep + '_b=' + APP_CURRENT_BUILD);
                  const nextInit = Object.assign({}, init || {}, { cache: 'no-store' });
                  return originalFetch.call(this, bustedUrl, nextInit);
                }
              }
            } catch (_) {}
            return originalFetch.apply(this, arguments);
          };
        }

        // Auto-expurgo de Service Worker e CacheStorage se o build mudou
        const lastBuild = localStorage.getItem('shaipados_active_build_v2');
        if (lastBuild !== String(APP_CURRENT_BUILD)) {
          localStorage.setItem('shaipados_active_build_v2', String(APP_CURRENT_BUILD));
          if ('caches' in window) {
            caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))).catch(() => {});
          }
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              Promise.all(regs.map((r) => r.unregister())).then(() => {
                window.location.reload();
              });
            }).catch(() => {});
          }
        }
      } catch (_) {}
    })();

    // Gerenciador de Instalação PWA
    window.pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-can-install'));
    });

    window.isPwaInstalled = function() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || 
             (window.navigator && window.navigator.standalone === true);
    };

    window.promptPwaInstall = function() {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then(() => {
          window.pwaDeferredPrompt = null;
        });
      }
    };

    // =========================================================================
    // Auto-Update Detector PWA (Padrão Ouro da Indústria)
    // Monitora atualizações no Service Worker em segundo plano e notifica a UI
    // =========================================================================
    (function initPwaUpdateDetector() {
      let waitingWorker = null;
      let isRefreshing = false;

      function notifyUpdateAvailable(worker) {
        if (worker) waitingWorker = worker;
        window._pwaHasPendingUpdate = true;
        if (typeof window._onPwaUpdateAvailable === 'function') {
          try {
            window._onPwaUpdateAvailable();
          } catch (_) {}
        }
        window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { worker: !!worker } }));
      }

      // Função unificada de recarregamento forçado (limpa cache HTTP e recarrega)
      window.hardReloadApp = globalThis.hardReloadApp = function() {
        try {
          const currentUrl = new URL(window.location.href);
          currentUrl.searchParams.set('_pwa_reload', Date.now());
          window.location.replace(currentUrl.href);
        } catch (_) {
          window.location.reload();
        }
      };

      window.forceAppReload = globalThis.forceAppReload = function() {
        try {
          window.location.reload();
        } catch (_) {}
      };

      // Função unificada de recarregamento limpo de caches PWA (exposta para JS e Dart)
      window.triggerPwaReload = globalThis.triggerPwaReload = async function() {
        if (isRefreshing) return;
        isRefreshing = true;
        window._pwaHasPendingUpdate = false;

        // Failsafe: garante hard reload em no máximo 1000ms
        const failsafeTimer = setTimeout(() => {
          window.hardReloadApp();
        }, 1000);

        try {
          if (waitingWorker) {
            try {
              waitingWorker.postMessage({ type: 'SKIP_WAITING' });
              waitingWorker.postMessage('skipWaiting');
            } catch (_) {}
          }

          // Limpa TODOS os caches de assets para garantir que os arquivos novos baixem
          if ('caches' in window) {
            try {
              const cacheKeys = await caches.keys();
              await Promise.all(cacheKeys.map((key) => caches.delete(key)));
            } catch (_) {}
          }

          // Desregistra service workers antigos para forçar o download limpo do novo bundle
          if ('serviceWorker' in navigator) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (let reg of registrations) {
                if (reg.waiting) {
                  try {
                    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    reg.waiting.postMessage('skipWaiting');
                  } catch (_) {}
                }
                await reg.unregister();
              }
            } catch (_) {}
          }
        } finally {
          clearTimeout(failsafeTimer);
          setTimeout(() => {
            window.hardReloadApp();
          }, 120);
        }
      };

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // Apenas recarrega se o recarregamento foi explicitamente acionado pelo usuário
          // (ex: clicou em 'Atualizar' na UI), evitando recarregamentos silenciosos em background
          // que engolem alertas de novidades ou interrompem a navegação ativa.
          if (isRefreshing) {
            window.location.reload();
          }
        });

        navigator.serviceWorker.ready.then((registration) => {
          // Checa imediatamente se já há um worker esperando (apenas se já houver controller)
          if (registration.waiting && navigator.serviceWorker.controller) {
            notifyUpdateAvailable(registration.waiting);
          }

          registration.addEventListener('updatefound', () => {
            const installingWorker = registration.installing;
            if (!installingWorker) return;

            installingWorker.addEventListener('statechange', () => {
              // Apenas notifica se houver controller ativo (não é primeira instalação)
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                notifyUpdateAvailable(installingWorker);
              }
            });
          });

          const checkForUpdates = () => {
            registration.update().catch(() => {});
            if (registration.waiting && navigator.serviceWorker.controller) {
              notifyUpdateAvailable(registration.waiting);
            }
          };

          window.addEventListener('focus', checkForUpdates);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              checkForUpdates();
            }
          });

          setInterval(checkForUpdates, 4 * 60 * 1000);
        });
      }

      // Função pública para teste imediato de interface no console:
      // Pode ser chamada via: window.simulatePwaUpdate()
      window.simulatePwaUpdate = function() {
        notifyUpdateAvailable(null);
      };
      // =========================================================================
      // Suporte WebAuthn / Biometria de Plataforma (Face ID, Touch ID, Digital)
      // =========================================================================
      window.isWebBiometricsAvailable = async function() {
        try {
          if (window.PublicKeyCredential &&
              typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
            return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          }
          return false;
        } catch (_) {
          return false;
        }
      };

      window.authenticateWithWebBiometrics = async function() {
        try {
          if (!window.PublicKeyCredential) {
            return false;
          }

          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16);
          window.crypto.getRandomValues(userId);

          // Dispara a folha nativa do sistema operacional (Face ID / Touch ID / Leitor de Digital)
          const cred = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: 'Mr. Coach | Shaipados', id: window.location.hostname },
              user: {
                id: userId,
                name: 'user@shaipados',
                displayName: 'Mr. Coach Autenticado'
              },
              pubKeyCredParams: [
                { alg: -7, type: 'public-key' },
                { alg: -257, type: 'public-key' }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required'
              },
              timeout: 60000
            }
          });

          return !!cred;
        } catch (err) {
          console.warn('[Biometria WebAuthn] Notificação:', err);
          return false;
        }
      };

      // =========================================================================
      // Motor de Áudio Esportivo (Web Audio API) & Vibração Nativa (3-2-1 GO!)
      // =========================================================================
      var _restAudioCtx = null;
      function _getRestAudioCtx() {
        try {
          if (!_restAudioCtx) {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              _restAudioCtx = new AudioCtx();
            }
          }
          if (_restAudioCtx && _restAudioCtx.state === 'suspended') {
            _restAudioCtx.resume();
          }
          return _restAudioCtx;
        } catch (_) {
          return null;
        }
      }

      window.unlockAudioContext = function() {
        try {
          var ctx = _getRestAudioCtx();
          if (ctx) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(0);
            osc.stop(ctx.currentTime + 0.01);
          }
        } catch (_) {}
      };

      // Destrava o AudioContext automaticamente no primeiro toque na tela
      document.addEventListener('touchstart', function _unlockTouch() {
        window.unlockAudioContext();
        document.removeEventListener('touchstart', _unlockTouch);
      }, { passive: true });
      document.addEventListener('click', function _unlockClick() {
        window.unlockAudioContext();
        document.removeEventListener('click', _unlockClick);
      }, { passive: true });

      function _playSportTone(ctx, freq, startOffset, duration, volume, type) {
        try {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = type || 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + startOffset);
          gain.gain.exponentialRampToValueAtTime(volume || 0.38, ctx.currentTime + startOffset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + startOffset);
          osc.stop(ctx.currentTime + startOffset + duration + 0.02);
        } catch (_) {}
      }

      window.triggerRestTimerCue = function(secondsRemaining, soundEnabled, hapticEnabled) {
        try {
          if (hapticEnabled && navigator.vibrate) {
            if (secondsRemaining <= 0) {
              navigator.vibrate([200, 90, 200, 90, 420]);
            } else if (secondsRemaining <= 3) {
              navigator.vibrate(90);
            }
          }
        } catch (_) {}

        try {
          if (soundEnabled) {
            var ctx = _getRestAudioCtx();
            if (!ctx) return;
            if (secondsRemaining === 3 || secondsRemaining === 2 || secondsRemaining === 1) {
              // Beep curto de contagem regressiva (880Hz - Lá5)
              _playSportTone(ctx, 880, 0.0, 0.12, 0.35, 'triangle');
            } else if (secondsRemaining <= 0) {
              // Alerta triplo ascendente de fim de descanso (GO!)
              _playSportTone(ctx, 880, 0.0, 0.12, 0.40, 'triangle');
              _playSportTone(ctx, 1174.66, 0.14, 0.12, 0.42, 'triangle');
              _playSportTone(ctx, 1318.51, 0.28, 0.36, 0.48, 'triangle');
            }
          }
        } catch (_) {}
      };
    })();
  </script>
