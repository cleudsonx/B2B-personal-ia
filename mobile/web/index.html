<!DOCTYPE html>

<head>

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mr. Coach: treinos e acompanhamento personalizados com seu treinador.">
  
  <!-- Status bar & Theme color (Seamless Edge-to-Edge matching Logo Background) -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000">
  <meta name="theme-color" content="#000000">
  
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mr. Coach | Shaipados Labs">
  <meta property="og:title" content="Seu treino, com acompanhamento de verdade | Mr. Coach">
  <meta property="og:description" content="Acesse seu convite e acompanhe seus treinos com o Mr. Coach e seu treinador.">
  <meta property="og:image" content="https://shaipados.com/assets/assets/images/app_icon.png">
  <meta property="og:url" content="https://shaipados.com/">
  <meta name="twitter:card" content="summary">

  <style>
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons (PWA Safari Support) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mr. Coach">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon-precomposed" href="icons/Icon-192.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">

  <title>Mr. Coach | Shaipados Labs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-can-install'));
    });

    window.isPwaInstalled = function() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || 
             (window.navigator && window.navigator.standalone === true);
    };

    window.promptPwaInstall = function() {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then(() => {
          window.pwaDeferredPrompt = null;
        });
      }
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
