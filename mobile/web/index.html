  <meta charset="UTF-8">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000">
  <meta name="theme-color" content="#000000">
  
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mr. Coach | Shaipados Labs">
  <meta property="og:title" content="Seu treino, com acompanhamento de verdade | Mr. Coach">

  <style>
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* PWA Update Banner - Meta / Dark Obsidian Style */
    .pwa-update-banner {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -30px);
      width: calc(100% - 32px);
      max-width: 460px;
      background: rgba(18, 18, 18, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), 0 0 20px rgba(16, 185, 129, 0.15);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 9999999;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      box-sizing: border-box;
    }

    .pwa-update-banner.visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .pwa-update-content {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .pwa-update-icon {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }

    .pwa-update-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .pwa-update-text strong {
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwa-update-text span {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwa-update-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pwa-update-btn {
      background: #10B981;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease, transform 0.1s ease;
      outline: none;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    }

    .pwa-update-btn:hover {
      background: #059669;
    }

    .pwa-update-btn:active {
      transform: scale(0.97);
    }

    .pwa-dismiss-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 20px;
      line-height: 1;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }

    .pwa-dismiss-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons (PWA Safari Support) -->

  <meta name="mobile-web-app-capable" content="yes">

  <title>Mr. Coach | Shaipados Labs</title>

</head>
<body>
  <!-- Banner Sutil de Auto-Update do PWA -->
  <div id="pwa-update-banner" class="pwa-update-banner" role="alert" aria-live="assertive">
    <div class="pwa-update-content">
      <span class="pwa-update-icon">🚀</span>
      <div class="pwa-update-text">
        <strong>Nova versão do Mr. Coach disponível!</strong>
        <span>Toque para carregar as últimas atualizações.</span>
      </div>
    </div>
    <div class="pwa-update-actions">
      <button id="pwa-update-btn" class="pwa-update-btn" type="button">Atualizar Agora</button>
      <button id="pwa-update-dismiss" class="pwa-dismiss-btn" type="button" aria-label="Fechar">&times;</button>
    </div>
  </div>

  <script>
    // Gerenciador de Instalação PWA
    window.pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-can-install'));
    });

    window.isPwaInstalled = function() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || 
             (window.navigator && window.navigator.standalone === true);
    };

    window.promptPwaInstall = function() {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then(() => {
          window.pwaDeferredPrompt = null;
        });
      }
    };

    // =========================================================================
    // Auto-Update Detector PWA (Padrão Ouro da Indústria)
    // Monitora atualizações no Service Worker em segundo plano e notifica o usuário
    // =========================================================================
    (function initPwaUpdateDetector() {
      let waitingWorker = null;
      let isRefreshing = false;

      const banner = document.getElementById('pwa-update-banner');
      const updateBtn = document.getElementById('pwa-update-btn');
      const dismissBtn = document.getElementById('pwa-update-dismiss');

      function showUpdateBanner(worker) {
        waitingWorker = worker;
        if (banner) {
          banner.classList.add('visible');
        }
      }

      function hideUpdateBanner() {
        if (banner) {
          banner.classList.remove('visible');
        }
      }

      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          hideUpdateBanner();
        });
      }

      if (updateBtn) {
        updateBtn.addEventListener('click', async () => {
          updateBtn.disabled = true;
          updateBtn.textContent = 'Atualizando...';

          if (waitingWorker) {
            // Notifica o novo worker para assumir o controle imediatamente
            waitingWorker.postMessage({ type: 'SKIP_WAITING' });
            waitingWorker.postMessage('skipWaiting');
          }

          // Limpa caches antigos de scripts e assets sem afetar tokens de login (localStorage)
          if ('caches' in window) {
            try {
              const cacheKeys = await caches.keys();
              await Promise.all(
                cacheKeys.map((key) => {
                  if (key.includes('flutter') || key.includes('app') || key.includes('shaipados')) {
                    return caches.delete(key);
                  }
                  return Promise.resolve();
                })
              );
            } catch (_) {}
          }

          // Recarrega imediatamente para subir o novo código limpo
          setTimeout(() => {
            if (!isRefreshing) {
              isRefreshing = true;
              window.location.reload();
            }
          }, 350);
        });
      }

      if ('serviceWorker' in navigator) {
        // Ao assumir novo controle (SKIP_WAITING ativado), recarrega
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });

        navigator.serviceWorker.ready.then((registration) => {
          // Checa imediatamente se já há uma versão esperando
          if (registration.waiting && navigator.serviceWorker.controller) {
            showUpdateBanner(registration.waiting);
          }

          // Monitora se o navegador encontrou um novo Service Worker
          registration.addEventListener('updatefound', () => {
            const installingWorker = registration.installing;
            if (!installingWorker) return;

            installingWorker.addEventListener('statechange', () => {
              if (
                installingWorker.state === 'installed' &&
                navigator.serviceWorker.controller
              ) {
                // Nova versão instalada com sucesso em segundo plano
                showUpdateBanner(installingWorker);
              }
            });
          });

          // Dispara checagem em segundo plano
          registration.update().catch(() => {});

          // Checa novamente quando o usuário volta para o PWA (focus / visibility)
          const checkForUpdates = () => {
            registration.update().catch(() => {});
            if (registration.waiting && navigator.serviceWorker.controller) {
              showUpdateBanner(registration.waiting);
            }
          };

          window.addEventListener('focus', checkForUpdates);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              checkForUpdates();
            }
          });

          // Checagem periódica a cada 20 minutos
          setInterval(checkForUpdates, 20 * 60 * 1000);
        });
      }
    })();
  </script>

  <!--
    Flutter Web bootstrap script
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
