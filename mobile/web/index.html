      background-color: #000000;

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons (PWA Safari Support) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon-precomposed" href="icons/Icon-192.png">

  <!-- Favicons -->

  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">

  <title>Mr. Coach | Shaipados Labs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Gerenciador de Instalação PWA
    window.pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-can-install'));
    });

    window.isPwaInstalled = function() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || 
             (window.navigator && window.navigator.standalone === true);
    };

    window.promptPwaInstall = function() {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then(() => {
          window.pwaDeferredPrompt = null;
        });
      }
    };

    // =========================================================================
    // Auto-Update Detector PWA (Padrão Ouro da Indústria)
    // Monitora atualizações no Service Worker em segundo plano e notifica a UI
    // =========================================================================
    (function initPwaUpdateDetector() {
      let waitingWorker = null;
      let isRefreshing = false;

      function notifyUpdateAvailable(worker) {
        if (worker) waitingWorker = worker;
        window._pwaHasPendingUpdate = true;
        if (typeof window._onPwaUpdateAvailable === 'function') {
          try {
            window._onPwaUpdateAvailable();
          } catch (_) {}
        }
        window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { worker: !!worker } }));
      }

      // Função unificada de recarregamento limpo de caches PWA (exposta para JS e Dart)
      window.triggerPwaReload = async function() {
        if (isRefreshing) return;
        isRefreshing = true;

        if (waitingWorker) {
          try {
            waitingWorker.postMessage({ type: 'SKIP_WAITING' });
            waitingWorker.postMessage('skipWaiting');
          } catch (_) {}
        }

        // Limpa caches de assets e scripts para subir código novo sem afetar tokens de login
        if ('caches' in window) {
          try {
            const cacheKeys = await caches.keys();
            await Promise.all(
              cacheKeys.map((key) => {
                if (key.includes('flutter') || key.includes('app') || key.includes('shaipados') || key.includes('workbox')) {
                  return caches.delete(key);
                }
                return Promise.resolve();
              })
            );
          } catch (_) {}
        }

        setTimeout(() => {
          window.location.reload();
        }, 300);
      };

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });

        navigator.serviceWorker.ready.then((registration) => {
          // Checa imediatamente se já há um worker esperando (no Android pode não ter controller prévio)
          if (registration.waiting) {
            notifyUpdateAvailable(registration.waiting);
          }

          registration.addEventListener('updatefound', () => {
            const installingWorker = registration.installing;
            if (!installingWorker) return;

            installingWorker.addEventListener('statechange', () => {
              if (installingWorker.state === 'installed') {
                notifyUpdateAvailable(installingWorker);
              }
            });
          });

          const checkForUpdates = () => {
            registration.update().catch(() => {});
            if (registration.waiting) {
              notifyUpdateAvailable(registration.waiting);
            }
          };

          window.addEventListener('focus', checkForUpdates);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              checkForUpdates();
            }
          });

          setInterval(checkForUpdates, 4 * 60 * 1000);
        });
      }

      // =========================================================================
      // Camada 2: Version Heartbeat via version.json (Resiliente a iOS e Android WebAPK)
      // =========================================================================
      const APP_CURRENT_BUILD = 2026102877;

      async function checkVersionFile() {
        try {
          const origin = window.location.origin || '';
          const versionUrl = origin + '/version.json?_t=' + Date.now();
          const res = await fetch(versionUrl, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            console.log('[PWA Heartbeat] Build local:', APP_CURRENT_BUILD, '| Servidor:', data?.build);
            if (data && data.build && Number(data.build) > APP_CURRENT_BUILD) {
              console.log('[PWA Heartbeat] Nova versão encontrada! Notificando Flutter.');
              notifyUpdateAvailable(null);
            }
          }
        } catch (err) {
          console.warn('[PWA Heartbeat] Checagem version.json:', err);
        }
      }

      // Função pública para teste imediato de interface:
      // Pode ser chamada no console do navegador via: window.simulatePwaUpdate()
      window.simulatePwaUpdate = function() {
        notifyUpdateAvailable(null);
      };

      // Dispara verificação rápida após 1.5s de carregamento e a cada 45s
      setTimeout(checkVersionFile, 1500);
      setInterval(checkVersionFile, 45 * 1000);

      window.addEventListener('focus', checkVersionFile);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkVersionFile();
        }
      });
      // =========================================================================
      // Suporte WebAuthn / Biometria de Plataforma (Face ID, Touch ID, Digital)
      // =========================================================================
      window.isWebBiometricsAvailable = async function() {
        try {
          if (window.PublicKeyCredential &&
              typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
            return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          }
          return false;
        } catch (_) {
          return false;
        }
      };

      window.authenticateWithWebBiometrics = async function() {
        try {
          if (!window.PublicKeyCredential) {
            return false;
          }

          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16);
          window.crypto.getRandomValues(userId);

          // Dispara a folha nativa do sistema operacional (Face ID / Touch ID / Leitor de Digital)
          const cred = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: 'Mr. Coach | Shaipados', id: window.location.hostname },
              user: {
                id: userId,
                name: 'user@shaipados',
                displayName: 'Mr. Coach Autenticado'
              },
              pubKeyCredParams: [
                { alg: -7, type: 'public-key' },
                { alg: -257, type: 'public-key' }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required'
              },
              timeout: 60000
            }
          });

          return !!cred;
        } catch (err) {
          console.warn('[Biometria WebAuthn] Notificação:', err);
          return false;
        }
      };
    })();
  </script>

  <!--
    Flutter Web bootstrap script
